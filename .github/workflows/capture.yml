name: radar-blackbox-capture

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Capture full watchlist
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collector.py --full

      - name: Capture Taiwan futures 1m -> 3m
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python futures_live.py
