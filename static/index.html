<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#06324a"/><link rel="manifest" href="/manifest.webmanifest"/><link rel="icon" href="/static/icon-192.png"/>
<title>市場雷達</title><style>
:root{
  --bg:#030607;
  --panel:#0d1214;
  --panel-2:#172126;
  --nav:#06324a;
  --cyan:#19b9f4;
  --red:#ff2d2d;
  --green:#24d642;
  --yellow:#e0dc35;
  --text:#f4f4f4;
  --muted:#9ba6aa;
  --line:#25333a;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
a{color:inherit;text-decoration:none}
button,select{font:inherit}
button{cursor:pointer}
.app-body{display:flex;justify-content:center}
.app-shell{
  width:100%;
  max-width:690px;
  min-height:100vh;
  background:var(--bg);
}
.home-header{
  height:64px;
  background:var(--nav);
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #0a6487;
}
.home-brand{font-size:28px;font-weight:800}
.home-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:#073d5c;
  border-left:1px solid #174f6b;
  border-top:1px solid #174f6b;
}
.home-tile{
  min-height:155px;
  border:0;
  border-right:1px solid #195874;
  border-bottom:1px solid #195874;
  background:#07476a;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
}
.home-tile.active-link:active{background:#0a5a84}
.home-tile.disabled{
  opacity:.52;
  cursor:default;
}
.tile-icon{font-size:52px;line-height:1;font-weight:700}
.tile-label{font-size:23px;font-weight:700}
.home-status{
  padding:18px;
  font-size:18px;
  background:#0d171b;
  border-top:1px solid var(--line);
}
.muted{color:var(--muted);margin-top:6px;font-size:15px}

.futures-header{
  height:64px;
  background:var(--nav);
  display:grid;
  grid-template-columns:70px 1fr 70px;
  align-items:center;
  border-bottom:1px solid #0a6487;
}
.contract-arrow{
  height:100%;
  background:transparent;
  border:0;
  color:#fff;
  font-size:32px;
}
.contract-title{
  height:100%;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.contract-title span{font-size:28px;font-weight:800}
.contract-title small{font-size:13px;color:#79d9ff;font-weight:700}
.contract-menu{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:min(88vw,460px);
  top:64px;
  z-index:40;
  border:1px solid var(--cyan);
  background:#11181b;
  box-shadow:0 10px 28px rgba(0,0,0,.5);
}
.contract-menu[hidden]{display:none}
.contract-menu button{
  width:100%;
  padding:15px 18px;
  background:#11181b;
  color:#fff;
  border:0;
  border-bottom:1px solid #2a363b;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
}
.contract-menu button.active{background:#0b5f84}
.contract-menu button span{color:#75d6ff;font-size:16px}

.page-actions{
  min-height:58px;
  padding:8px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#071014;
  border-bottom:1px solid var(--line);
}
.back-main-btn{
  min-height:44px;
  padding:10px 18px;
  border:1px solid #2c88ad;
  border-radius:8px;
  background:#123a4d;
  font-size:18px;
  font-weight:800;
}
.data-badge{
  padding:6px 10px;
  border-radius:14px;
  background:#5b5f63;
  color:#fff;
  font-size:13px;
}

.quote-summary{
  display:grid;
  grid-template-columns:1.1fr .8fr 1.25fr;
  gap:8px;
  padding:9px 10px;
  border-bottom:1px solid var(--line);
}
.quote-left,.quote-mid,.quote-right{display:flex;flex-direction:column;justify-content:center}
.last-price{font-size:52px;line-height:1;font-weight:800}
.change-text{font-size:22px;margin-top:5px}
.quote-mid{font-size:18px;gap:8px}
.symbol-line{display:flex;gap:14px;color:#f2df35}
.quote-right{gap:7px}
.quote-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 10px;
  border:1px solid #4d3434;
  background:#090b0c;
}
.quote-box span{font-size:17px}
.quote-box strong{font-size:21px}
.quote-time{text-align:right;color:#ffe93b;font-size:15px}
.up{color:var(--red)}
.down{color:var(--green)}
.yellow{color:var(--yellow)}

.primary-tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:#172126;
  border-bottom:3px solid var(--cyan);
}
.primary-tab{
  padding:13px 3px;
  border:0;
  background:#172126;
  color:#8f999d;
  font-size:19px;
}
.primary-tab.active{background:#1db7ee;color:#fff}
.futures-view{display:none}
.futures-view.active{display:block}

.secondary-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:#172126;
}
.secondary-tab{
  padding:12px;
  background:#172126;
  color:#8f999d;
  border:1px solid #25343a;
  font-size:19px;
}
.secondary-tab.active{color:#fff;border-color:#18aefa;box-shadow:inset 0 0 0 1px #18aefa}
.detail-pane{display:none}
.detail-pane.active{display:block}

.table-head{
  background:#192125;
  color:#fff;
  padding:11px 8px;
  border-bottom:1px solid var(--line);
  font-size:18px;
  text-align:center;
}
.tick-cols{display:grid;grid-template-columns:1.35fr 1.15fr 1.15fr 1.15fr .7fr;gap:4px}
.tick-row{
  display:grid;
  grid-template-columns:1.35fr 1.15fr 1.15fr 1.15fr .7fr;
  padding:10px 8px;
  text-align:center;
  font-size:19px;
  border-bottom:1px solid #171d20;
}
.tick-row:nth-child(even){background:#0c0f10}
.range-panel{padding:14px}
.range-panel button{
  width:100%;
  padding:17px;
  border:0;
  border-bottom:1px solid #979797;
  background:#c9c9c9;
  font-size:22px;
}

.chips{
  display:flex;
  overflow:auto;
  gap:7px;
  padding:8px;
  background:#0f1518;
}
.chips button{
  flex:0 0 auto;
  border:0;
  border-radius:5px;
  background:#151a1d;
  color:#d6d9db;
  padding:8px 13px;
  font-size:17px;
}
.chips button.active{background:#d7d7d7;color:#333}

.chart-card{padding:8px;background:#040606}
.chart-card canvas{
  width:100%;
  height:330px;
  display:block;
  background:#000;
  border:1px solid #233037;
}
.chart-card.small canvas{height:190px}
.chart-card.tall canvas{height:400px}
.indicator-row{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  padding:8px 10px;
  background:#11181b;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.institution-toolbar{

  gap:10px;
  align-items:center;
  justify-content:space-between;
  padding:12px;
  background:#11181b;
}
.institution-toolbar select{
  max-width:48%;

  background:#2b3337;
  color:#fff;
  border:0;

.mode-toggle{display:flex}

}

.institution-cols{display:grid;grid-template-columns:1.05fr 1fr 1fr 1fr 1fr;gap:4px}
.institution-row{
  display:grid;
  grid-template-columns:1.05fr 1fr 1fr 1fr 1fr;
  gap:4px;
  padding:13px 8px;
  text-align:center;
  border-bottom:1px solid #1f272b;
  font-size:17px;
}

.signal-timeframe{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  padding:10px 8px;
  background:#0d1214;
}
.signal-timeframe div{display:flex;flex-direction:column;align-items:center;gap:4px}
.signal-timeframe span{font-size:13px}
.signal-timeframe b{width:100%;padding:7px 2px;border-radius:4px;text-align:center;font-size:13px}
.strong{background:#7b0000;color:#fff}
.weak{background:#035b12;color:#fff}
.signal-summary{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.signal-summary>div{
  display:grid;
  grid-template-columns:1.6fr 1.1fr .8fr .8fr;
  gap:8px;
  align-items:center;
  padding:11px 10px;
  font-size:17px;
}
.badge{text-align:center;padding:8px}
.section-title{
  margin-top:8px;
  padding:10px;
  text-align:center;
  background:#054263;
  font-size:19px;
}
.metric-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  padding:8px;
  background:#0b0e10;
}
.metric-grid>div{
  min-height:92px;
  padding:8px;
  border:2px solid #6d2b1c;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;

.metric-grid span{font-size:16px;color:#a9b0b3}
.metric-grid strong{font-size:19px;margin:3px 0}

  .quote-mid{font-size:15px}
  .quote-box span{font-size:14px}

.right-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.session-btn{border:1px solid #41515a;background:#11181b;color:#cbd5e1;padding:7px 10px;border-radius:8px;font-size:14px}
.session-btn.active{background:#0b6f99;color:#fff;border-color:#19b9f4}
.honesty-note{padding:10px 12px;color:#fbbf24;background:#16130a;border-bottom:1px solid #56460f;font-size:13px;line-height:1.45}
.snapshot-row{display:grid;grid-template-columns:1.35fr 1.15fr 1.15fr 1.15fr .85fr;gap:4px;padding:12px 8px;text-align:center;font-size:18px;border-bottom:1px solid #171d20}
.subsection-title{padding:10px 12px;background:#0d171b;border-top:1px solid #25333a;border-bottom:1px solid #25333a;font-size:17px;font-weight:800}
.bar-cols{display:grid;grid-template-columns:1.35fr repeat(4,1fr) .85fr;gap:4px}
.bar-row{display:grid;grid-template-columns:1.35fr repeat(4,1fr) .85fr;gap:4px;padding:9px 8px;text-align:center;font-size:16px;border-bottom:1px solid #171d20}
.bar-row:nth-child(even){background:#0c0f10}
.chart-meta{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;background:#0f1518;color:#cbd5e1;font-size:14px}
.empty-state{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:#cbd5e1}
.empty-state strong{font-size:22px;color:#fff}
.empty-state span{max-width:520px;line-height:1.6;color:#94a3b8}
.signal-content{padding:10px}
.signal-card{background:#111827;border:1px solid #334155;border-radius:14px;padding:14px;margin-bottom:10px}
.signal-card .big{font-size:24px;font-weight:900;margin:6px 0}
.signal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.signal-kv{background:#0f172a;border-radius:10px;padding:10px}
.signal-kv .k{font-size:12px;color:#94a3b8}
.signal-kv .v{font-size:20px;font-weight:900;margin-top:4px}
@media(max-width:520px){
  .page-actions{align-items:flex-start}
  .right-actions{max-width:55%}
  .snapshot-row{font-size:15px}
  .bar-row,.bar-cols{font-size:13px}
}

.page{display:none}.page.active{display:block}.back-main-btn{cursor:pointer}

<script>
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);setTimeout(()=>{if(typeof drawAllCharts==='function')drawAllCharts()},50)}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('openFutures')?.addEventListener('click',()=>{location.hash='futures';showPage('futuresPage')});document.getElementById('backHome')?.addEventListener('click',()=>{location.hash='';showPage('homePage')});if(location.hash==='#futures')showPage('futuresPage')});

const qs=(s,r=document)=>r.querySelector(s);
const qsa=(s,r=document)=>[...r.querySelectorAll(s)];

const PRODUCTS={
  TX:{name:'台指近',code:'TX',product:'TXF_CONT',symbol:'WTX&',page:'future'},
  MTX:{name:'小台近',code:'MTX',product:'MTX_CONT',symbol:'WMT&',page:'future'},
  TMF:{name:'微台近',code:'TMF',product:'TMF_CONT',symbol:'WTM&',page:'quote'}
};
const ORDER=['TX','MTX','TMF'];
let current='TX';
let session='day';
let currentBars=[];
let latestThreshold=null;

function fmt(v,d=2){
  if(v===null||v===undefined||v===''||Number.isNaN(Number(v))) return '—';
  return Number(v).toLocaleString('zh-TW',{maximumFractionDigits:d});
}
function signed(v,d=2){
  if(v===null||v===undefined||Number.isNaN(Number(v))) return '—';
  const n=Number(v); return `${n>0?'+':''}${fmt(n,d)}`;
}
function colorClass(v){const n=Number(v);return n>0?'up':n<0?'down':''}
function hhmm(ts){
  if(ts===null||ts===undefined) return '—';
  let n=Number(ts);
  if(!Number.isFinite(n)) return '—';
  if(n<1e12)n*=1000;
  const d=new Date(n);
  return d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});
}
function dateTime(v){
  if(!v)return '—';
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return String(v);
  return d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}
async function jsonFetch(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return await r.json();
}
function setBadge(text,kind=''){
  const el=qs('#dataBadge'); el.textContent=text; el.className='data-badge';
  if(kind)el.classList.add(kind);
}
function yahooUrl(meta){
  return `https://tw.stock.yahoo.com/${meta.page}/${encodeURIComponent(meta.symbol)}`;
}

async function loadQuote(){
  const m=PRODUCTS[current];
  try{
    const u=`/api/quote?url=${encodeURIComponent(yahooUrl(m))}&symbol=${encodeURIComponent(m.symbol)}`;
    const d=await jsonFetch(u);
    const last=d.last;
    qs('#lastPrice').textContent=fmt(last);
    qs('#bidPrice').textContent=fmt(d.bid);
    qs('#askPrice').textContent=fmt(d.ask);
    qs('#totalQty').textContent=fmt(d.volume,0);
    qs('#quoteSymbol').textContent=m.symbol;
    const change=d.change;
    const pct=d.change_pct;
    const cls=colorClass(pct??change);
    ['#lastPrice','#changeText','#bidPrice','#askPrice'].forEach(id=>{
      qs(id).classList.remove('up','down');
      if(cls)qs(id).classList.add(cls);
    });
    const arrow=Number(pct??change)>0?'▲':Number(pct??change)<0?'▼':'';
    qs('#changeText').textContent=`${arrow} ${signed(change)} (${signed(pct)}%)`;
    qs('#quoteTime').textContent=dateTime(d.ts_server);
    renderSnapshot(d);
    setBadge(d.cached?'行情快取':'行情已抓取',d.cached?'warn':'ok');
  }catch(err){
    setBadge('行情讀取失敗','bad');
    qs('#quoteTime').textContent='讀取失敗';
    renderSnapshot(null);
    console.error(err);
  }
}
function renderSnapshot(d){
  const box=qs('#snapshotTable');
  if(!d){
    box.innerHTML='<div class="empty-state"><span>目前抓不到最新行情快照。</span></div>';
    return;
  }
  box.innerHTML=`<div class="snapshot-row">
    <span>${dateTime(d.ts_server).split(' ').pop()}</span>
    <span class="${colorClass(d.change_pct)}">${fmt(d.bid)}</span>
    <span class="${colorClass(d.change_pct)}">${fmt(d.ask)}</span>
    <span class="${colorClass(d.change_pct)}">${fmt(d.last)}</span>
    <span>${fmt(d.volume,0)}</span>
  </div>`;
}
async function loadBars(){
  const m=PRODUCTS[current];
  try{
    const u=`/api/blackbox/futures/3m?product=${encodeURIComponent(m.product)}&session=${session}&limit=400`;
    const j=await jsonFetch(u);
    currentBars=(j.bars||[]).filter(b=>b.close!==null&&b.close!==undefined);
    qs('#trendDate').textContent=`${session==='day'?'日盤':'夜盤'} ${j.trading_date||'—'}`;
    qs('#techDate').textContent=`${session==='day'?'日盤':'夜盤'} ${j.trading_date||'—'}`;
    renderBarsTable();
    renderMA();
    setTimeout(drawAllCharts,30);
  }catch(err){
    currentBars=[];
    renderBarsTable();
    renderMA();
    setTimeout(drawAllCharts,30);
    console.error(err);
  }
}
function renderBarsTable(){
  const box=qs('#barsTable');
  if(!currentBars.length){
    box.innerHTML='<div class="empty-state"><span>這個商品／盤別目前沒有 3 分K資料。</span></div>';
    return;
  }
  const rows=currentBars.slice(-16).reverse();
  box.innerHTML=rows.map(b=>`<div class="bar-row">
    <span>${hhmm(b.ts_utc)}</span>
    <span>${fmt(b.open)}</span>
    <span>${fmt(b.high)}</span>
    <span>${fmt(b.low)}</span>
    <span>${fmt(b.close)}</span>
    <span>${fmt(b.volume,0)}</span>
  </div>`).join('');
}
function sma(n){
  if(currentBars.length<n)return null;
  const a=currentBars.slice(-n).map(b=>Number(b.close)).filter(Number.isFinite);
  return a.length===n?a.reduce((x,y)=>x+y,0)/n:null;
}
function renderMA(){
  const vals=[5,10,20].map(n=>[n,sma(n)]);
  qs('#maRow').innerHTML='<strong>MA</strong>'+vals.map(([n,v])=>`<span>${n}T <b>${fmt(v)}</b></span>`).join('');
}

const trendMap={
  BIG_UP:'🟢 大漲趨勢',STRONG_UP:'🟢 明顯偏多',UP_BIAS:'🟢 偏多',
  UP_MOVE_WEAKENING:'🟡 上漲轉弱',RANGE:'🟡 盤整',
  DOWN_MOVE_WEAKENING:'🟡 下跌轉弱',DOWN_BIAS:'🔴 偏空',
  STRONG_DOWN:'🔴 明顯偏空',BIG_DOWN:'🔴 大跌趨勢'
};
const entryMap={
  LONG_START_3M:'🟡 3分多方啟動',LONG_START_3M_COUNTERTREND:'🟡 3分反彈但逆勢',
  LONG_CONFIRM_6M:'🟢 6分多方確認',LONG_DECISION_9M:'🟢 9分多方決策成立',
  SHORT_START_3M:'🟡 3分空方啟動',SHORT_START_3M_COUNTERTREND:'🟡 3分下殺但逆勢',
  SHORT_CONFIRM_6M:'🔴 6分空方確認',SHORT_DECISION_9M:'🔴 9分空方決策成立',
  WAIT_NO_CHASE_UP:'🟡 等待，不追高',WAIT_NO_CHASE_DOWN:'🟡 等待，不追空',
  WAIT_TREND_WEAKENING:'🟡 趨勢轉弱，等待',WAIT_DIRECTION:'🟡 方向不夠明確，等待',
  WAIT_DATA:'⚪ 資料不足'
};
async function loadThreshold(){
  const m=PRODUCTS[current];
  try{
    const j=await jsonFetch(`/api/blackbox/futures/threshold?product=${encodeURIComponent(m.product)}&session=${session}`);
    latestThreshold=j;
    renderThreshold();
  }catch(err){
    latestThreshold=null; renderThreshold(); console.error(err);
  }
}
function renderThreshold(){
  const box=qs('#signalContent');
  if(!latestThreshold){
    box.innerHTML='<div class="empty-state"><strong>趨勢雷達讀取失敗</strong></div>';
    return;
  }
  const d=latestThreshold.dynamic_threshold||{};
  if(!d.ok){
    box.innerHTML=`<div class="empty-state"><strong>資料不足</strong><span>${d.reason||'目前無法形成趨勢判定'}</span></div>`;
    return;
  }
  const trend=trendMap[d.market_trend_state]||d.market_trend_state||'—';
  const entry=entryMap[d.entry_state]||d.entry_state||'—';
  const m=d.metrics||{}, e=d.entry_signal||{};
  box.innerHTML=`
    <div class="signal-card">
      <div>整體趨勢</div>
      <div class="big">${trend} ${fmt(d.market_trend_strength_pct)}%</div>
      <div>現在動作</div>
      <div class="big">${entry} ${fmt(d.entry_strength_pct)}%</div>
      <div class="muted">${latestThreshold.trading_date||'—'} ・ ${session==='day'?'日盤':'夜盤'}</div>
    </div>
    <div class="signal-grid">
      <div class="signal-kv"><div class="k">3分動能</div><div class="v">${signed(m.momentum_3m_points)}</div></div>
      <div class="signal-kv"><div class="k">6分動能</div><div class="v">${signed(m.momentum_6m_points)}</div></div>
      <div class="signal-kv"><div class="k">9分動能</div><div class="v">${signed(m.momentum_9m_points)}</div></div>
      <div class="signal-kv"><div class="k">量能比</div><div class="v">${fmt(m.volume_ratio)}</div></div>
      <div class="signal-kv"><div class="k">多方觸發</div><div class="v up">${fmt(e.long_trigger)}</div></div>
      <div class="signal-kv"><div class="k">空方觸發</div><div class="v down">${fmt(e.short_trigger)}</div></div>
    </div>`;
}

function fitCanvas(canvas){
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const r=canvas.getBoundingClientRect();
  canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  return{ctx,w:r.width,h:r.height};
}
function grid(ctx,w,h){
  ctx.strokeStyle='#223038';ctx.lineWidth=1;
  for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(0,h*i/5);ctx.lineTo(w,h*i/5);ctx.stroke();}
  for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(w*i/6,0);ctx.lineTo(w*i/6,h);ctx.stroke();}
}
function rangeForBars(){
  if(!currentBars.length)return null;
  const highs=currentBars.map(b=>Number(b.high)).filter(Number.isFinite);
  const lows=currentBars.map(b=>Number(b.low)).filter(Number.isFinite);
  if(!highs.length||!lows.length)return null;
  let min=Math.min(...lows),max=Math.max(...highs);
  if(max===min){max+=1;min-=1}
  const pad=(max-min)*.06;return{min:min-pad,max:max+pad};
}
function yMap(v,r,h){return h-(Number(v)-r.min)/(r.max-r.min)*h}
function drawTrend(){
  const c=qs('#trendChart');if(!c||!c.offsetParent)return;
  const{ctx,w,h}=fitCanvas(c);grid(ctx,w,h);
  if(!currentBars.length)return;
  const r=rangeForBars();const bars=currentBars;
  ctx.strokeStyle='#e2272d';ctx.lineWidth=2;ctx.beginPath();
  bars.forEach((b,i)=>{const x=i/Math.max(1,bars.length-1)*w,y=yMap(b.close,r,h);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
}
function drawVolume(id){
  const c=qs(id);if(!c||!c.offsetParent)return;
  const{ctx,w,h}=fitCanvas(c);grid(ctx,w,h);
  if(!currentBars.length)return;
  const max=Math.max(1,...currentBars.map(b=>Number(b.volume)||0));
  const bw=Math.max(1,w/currentBars.length*.7);
  currentBars.forEach((b,i)=>{
    ctx.fillStyle=Number(b.close)>=Number(b.open)?'#e92525':'#24dc3d';
    const v=(Number(b.volume)||0)/max;
    ctx.fillRect(i/currentBars.length*w,h*(1-v),bw,h*v);
  });
}
function rollingSma(bars,n,i){
  if(i<n-1)return null;
  let s=0;
  for(let k=i-n+1;k<=i;k++)s+=Number(bars[k].close);
  return s/n;
}
function drawK(){
  const c=qs('#kChart');if(!c||!c.offsetParent)return;
  const{ctx,w,h}=fitCanvas(c);grid(ctx,w,h);
  if(!currentBars.length)return;
  const bars=currentBars,r=rangeForBars(),step=w/bars.length;
  bars.forEach((b,i)=>{
    const x=i*step+step/2,yo=yMap(b.open,r,h),yc=yMap(b.close,r,h),yh=yMap(b.high,r,h),yl=yMap(b.low,r,h);
    const up=Number(b.close)>=Number(b.open);
    ctx.strokeStyle=up?'#ef2727':'#24dc3d';ctx.fillStyle=ctx.strokeStyle;
    ctx.beginPath();ctx.moveTo(x,yh);ctx.lineTo(x,yl);ctx.stroke();
    ctx.fillRect(x-step*.28,Math.min(yo,yc),Math.max(1,step*.56),Math.max(2,Math.abs(yc-yo)));
  });
  const specs=[[5,'#f1d23d'],[10,'#4cc3e7'],[20,'#a855f7']];
  specs.forEach(([n,color])=>{
    ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();let started=false;
    bars.forEach((b,i)=>{const v=rollingSma(bars,n,i);if(v===null)return;const x=i*step+step/2,y=yMap(v,r,h);if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)});
    ctx.stroke();
  });
}
function drawAllCharts(){drawTrend();drawVolume('#trendVol');drawK();drawVolume('#techVol')}
window.addEventListener('resize',()=>setTimeout(drawAllCharts,80));

function applyProduct(code){
  current=code;const m=PRODUCTS[code];
  qs('#contractName').textContent=m.name;qs('#contractCode').textContent=m.code;qs('#quoteSymbol').textContent=m.symbol;
  qsa('#contractMenu button').forEach(b=>b.classList.toggle('active',b.dataset.contract===code));
  qs('#contractMenu').hidden=true;
  refreshAll();
}
function setSession(s){
  session=s;
  qs('#sessionDay').classList.toggle('active',s==='day');
  qs('#sessionNight').classList.toggle('active',s==='night');
  loadBars();loadThreshold();
}
async function refreshAll(){
  setBadge('讀取中');
  await Promise.allSettled([loadQuote(),loadBars(),loadThreshold()]);
}

document.addEventListener('click',e=>{const menu=qs('#contractMenu');if(!menu.hidden&&!menu.contains(e.target)&&!qs('#contractPicker').contains(e.target))menu.hidden=true});

qs('#sessionNight').addEventListener('click',()=>setSession('night'));

qsa('.primary-tab').forEach(btn=>btn.addEventListener('click',()=>{
  qsa('.primary-tab').forEach(x=>x.classList.remove('active'));
