<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#111827"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="icon" href="/static/icon-192.png"/>
  <title>手機股票雷達 v0.6</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1220;color:#f8fafc}
    *{box-sizing:border-box} body{margin:0;padding:16px;max-width:760px;margin:auto}
    h1{font-size:24px;margin:8px 0 4px}.sub{color:#94a3b8;margin-bottom:14px;line-height:1.5}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    button{border-radius:12px;border:1px solid #334155;background:#111827;color:#fff;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}
    button.primary{background:#2563eb;border-color:#2563eb} button:disabled{opacity:.55}
    .card{background:#111827;border:1px solid #273449;border-radius:16px;padding:14px;margin:10px 0}
    .title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .name{font-size:20px;font-weight:800}.sym{font-size:13px;color:#94a3b8;margin-top:2px}
    .pct{font-size:18px;font-weight:800}.price{font-size:32px;font-weight:900;margin:8px 0}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .cell{background:#0f172a;border-radius:10px;padding:8px;min-height:54px}.label{font-size:12px;color:#94a3b8}.val{font-weight:700;margin-top:3px}
    .up{color:#f87171}.down{color:#4ade80}.muted{color:#94a3b8}
    .status{font-size:12px;margin-top:10px;color:#cbd5e1;line-height:1.45}.error{color:#fca5a5}
    .note{font-size:13px;color:#94a3b8;line-height:1.6;margin-top:16px}.badge{font-size:11px;border:1px solid #334155;border-radius:999px;padding:2px 7px;color:#cbd5e1}
    @media(max-width:430px){.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <h1>📈 手機股票雷達 <span class="badge">v0.6</span></h1>
  <div class="sub">Yahoo 股市輕量 HTTP 行情版。直接抓 6770 力積電、2609 陽明、WTX&amp; 台指期近一，不必貼網址。</div>

  <div class="row">
    <button id="refreshBtn" class="primary" onclick="loadAll()">更新全部</button>
    <button onclick="addToHome()">安裝 App</button>
    <button id="autoBtn" onclick="toggleAuto()">自動更新：關</button>
  </div>

  <div id="cards"><div class="muted">準備抓取…</div></div>

  <div class="note">
    這版只讀公開行情，不含下單功能。v0.6 已移除 Chromium，降低 Render 免費 512MB 記憶體不足造成 Failed to fetch 的機率。若 Yahoo 改版，會顯示實際錯誤，不猜數字。<br/>
    Render 免費方案閒置後會休眠，第一次更新仍可能需要稍久。
  </div>

<script>
let deferredPrompt;
let autoTimer=null;
const cards=document.getElementById('cards');
const refreshBtn=document.getElementById('refreshBtn');

function toggleAuto(){
  const btn=document.getElementById('autoBtn');
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; btn.textContent='自動更新：關'; return; }
  autoTimer=setInterval(loadAll, 60000);
  btn.textContent='自動更新：60秒';
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
async function addToHome(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; }
  else alert('Android Chrome：右上角選單 → 加到主畫面 / 安裝應用程式');
}
function fmt(v){
  if(v===null || v===undefined || Number.isNaN(Number(v))) return '—';
  return Number(v).toLocaleString('zh-TW',{maximumFractionDigits:2});
}
function clsFor(v){ return (v??0)>0?'up':((v??0)<0?'down':''); }
function cell(label,value){ return `<div class="cell"><div class="label">${label}</div><div class="val">${fmt(value)}</div></div>`; }
function card(sym,d){
  if(d.ok===false){
    return `<div class="card"><div class="title"><div><div class="name">${d.name||sym}</div><div class="sym">${sym}</div></div></div>
      <div class="status error">⚠️ ${d.error||'抓取失敗'}</div></div>`;
  }
  const cls=clsFor(d.change_pct);
  const pct=d.change_pct==null?'':`${d.change_pct>0?'+':''}${fmt(d.change_pct)}%`;
  const isFuture=(d.kind==='future'||sym==='WTX&');
  const extra=isFuture
    ? `${cell('買價',d.bid)}${cell('賣價',d.ask)}${cell('未平倉',d.open_interest)}`
    : `${cell('昨收',d.prev_close)}${cell('總量',d.volume)}${cell('漲跌',d.change)}`;
  const when=d.ts_server?new Date(d.ts_server).toLocaleString('zh-TW'):'—';
  return `<div class="card">
    <div class="title"><div><div class="name">${d.name||sym}</div><div class="sym">${sym}</div></div><div class="pct ${cls}">${pct}</div></div>
    <div class="price ${cls}">${fmt(d.last)}</div>
    <div class="grid">
      ${cell('開盤',d.open)}${cell('最高',d.high)}${cell('最低',d.low)}${extra}
    </div>
    <div class="status">更新：${when}${d.cached?'（快取）':''}</div>
  </div>`;
}
async function jsonFetch(url){
  const r=await fetch(url,{cache:'no-store'});
  const text=await r.text();
  let j;
  try{ j=JSON.parse(text); }catch(_){ throw new Error(`HTTP ${r.status}：${text.slice(0,120)||'非 JSON 回應'}`); }
  if(!r.ok) throw new Error(j.detail||`HTTP ${r.status}`);
  return j;
}
async function loadAll(){
  refreshBtn.disabled=true;
  cards.innerHTML='<div class="muted">抓取中… v0.6 不啟動雲端瀏覽器，通常數秒內完成。</div>';
  try{
    const j=await jsonFetch('/api/all');
    cards.innerHTML=Object.entries(j).map(([s,d])=>card(s,d)).join('');
  }catch(e){
    cards.innerHTML='<div class="card"><div class="status error">連線失敗：'+String(e.message||e)+'</div></div>';
  }finally{ refreshBtn.disabled=false; }
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}); }
window.addEventListener('online', loadAll);
loadAll();
</script>
</body>
</html>
